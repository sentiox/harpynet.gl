name: Build packages

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag to build and publish
        required: false
        type: string
      release_notes:
        description: Optional release notes/comment
        required: false
        type: string
  push:
    tags:
      - '*'

permissions:
  contents: write

jobs:
  preparation:
    name: Setup build version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      commitish: ${{ steps.version.outputs.commitish }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: version
        shell: bash
        run: |
          INPUT_TAG="${{ inputs.release_tag || '' }}"
          if [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          elif [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            TAG="$GITHUB_REF_NAME"
          else
            TAG="$(git tag --points-at HEAD | sort -V | tail -n 1)"
          fi

          if [ -z "$TAG" ]; then
            echo "::error::No release tag found"
            exit 1
          fi

          VERSION="${TAG#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+(\.[0-9]+){2}([.-][0-9]+)?$ ]]; then
            echo "::error::Release version must use vX.Y.Z, X.Y.Z, X.Y.Z.N or X.Y.Z-N format; got: ${VERSION:-<empty>}"
            exit 1
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "commitish=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    name: Build HarpyNet GL packages
    runs-on: ubuntu-latest
    needs: preparation
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cache OpenWrt SDK
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/harpynet-gl/openwrt-sdk
            ./.build/sdk
          key: harpynet-gl-openwrt-sdk-${{ runner.os }}-24.10.6-25.12.3

      - name: Build release artifacts
        shell: bash
        run: |
          VERSION="${{ needs.preparation.outputs.version }}"
          bash ./scripts/build-openwrt-packages.sh "$VERSION" "$PWD/dist/release"
          ls -la "$PWD/dist/release"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-files-${{ needs.preparation.outputs.tag }}
          path: ./dist/release/*
          retention-days: 7
          if-no-files-found: error

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs:
      - preparation
      - build
    steps:
      - uses: actions/checkout@v4

      - name: Create release notes
        shell: bash
        run: |
          TAG="${{ needs.preparation.outputs.tag }}"
          {
            printf 'HarpyNet GL %s\n\n' "$TAG"
            printf 'Native GL.iNet package release.\n\n'
            printf 'Install:\n```sh\n'
            printf 'sh -c "$(wget -O - https://raw.githubusercontent.com/sentiox/harpynet.gl/main/install.sh)"\n'
            printf '```\n'
          } > ./release-notes.md

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-files-${{ needs.preparation.outputs.tag }}
          path: ./dist/release

      - name: Release
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.release_notes == '' }}
        uses: softprops/action-gh-release@v2
        with:
          files: ./dist/release/*.*
          draft: false
          prerelease: false
          make_latest: true
          name: ${{ needs.preparation.outputs.tag }}
          tag_name: ${{ needs.preparation.outputs.tag }}
          target_commitish: ${{ needs.preparation.outputs.commitish }}
          body_path: ./release-notes.md

      - name: Release with notes
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.release_notes != '' }}
        uses: softprops/action-gh-release@v2
        with:
          files: ./dist/release/*.*
          draft: false
          prerelease: false
          make_latest: true
          name: ${{ needs.preparation.outputs.tag }}
          tag_name: ${{ needs.preparation.outputs.tag }}
          target_commitish: ${{ needs.preparation.outputs.commitish }}
          body: ${{ inputs.release_notes }}
